# Font Settings
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Icons/powerline glyphs from the Mono variant: the plain "Nerd Font" ones are wider than a cell and get clipped (chopped prompt pills)
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font Mono

# Window Aesthetics & Opacity
background_opacity 0.72
confirm_os_window_close 0
window_padding_width 10

# Borders
hide_window_decorations no
window_border_width 2pt
active_border_color #C6A0F6
inactive_border_color #494D64
draw_minimal_borders yes

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Catppuccin Macchiato Colors
foreground              #CAD3F5
background              #24273A
selection_foreground    #24273A
selection_background    #F4DBD6
cursor                  #F4DBD6
cursor_text_color       #24273A
active_tab_foreground   #1E2030
active_tab_background   #C6A0F6
inactive_tab_foreground #CAD3F5
inactive_tab_background #1E2030


# Cursor Trail & Animations
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_shape beam
cursor_blink_interval 0.5


# Tile like any other window; don't restore a remembered maximized state
remember_window_size no
initial_window_width 80c
initial_window_height 25c
