shell=fish
term=xterm-256color

title=foot
app-id=foot

font=JetBrainsMono Nerd Font:size=12
font-bold=JetBrainsMono Nerd Font:weight=ExtraBold:size=12
font-italic=JetBrainsMono Nerd Font:style=Italic:size=12
line-height=18
letter-spacing=0
dpi-aware=no

pad=22x18 center
initial-window-mode=windowed
bold-text-in-bright=no
underline-offset=3
box-drawings-uses-font-glyphs=yes

[environment]
COLORTERM=truecolor

[bell]
urgent=no
notify=no

[csd]
preferred=none

[colors]
# Catppuccin Macchiato fallback; the wallpaper theme (applycolor.sh) overrides these via OSC at shell start
alpha=0.88
foreground=cad3f5
background=24273a
regular0=494d64
regular1=ed8796
regular2=a6da95
regular3=eed49f
regular4=8aadf4
regular5=f5bde6
regular6=8bd5ca
regular7=b8c0e0
bright0=5b6078
bright1=ed8796
bright2=a6da95
bright3=eed49f
bright4=8aadf4
bright5=f5bde6
bright6=8bd5ca
bright7=a5adcb
selection-foreground=24273a
selection-background=f4dbd6
search-box-no-match=24273a ed8796
search-box-match=cad3f5 363a4f
jump-labels=24273a c6a0f6
urls=8aadf4

[scrollback]
lines=20000
indicator-position=none

[cursor]
style=beam
blink=yes
beam-thickness=2
# underline-thickness=<font underline thickness>

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
